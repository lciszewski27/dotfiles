# Options for scripts/rtx-vsr.lua (NVIDIA RTX Video Super Resolution)
# Toggle anytime in mpv with alt+v.

# Master switch (yes/no)
enabled=yes

# Only engage when the upscale factor is at least this (driver needs >1)
min_scale=1.2

# Upper cap for the scale factor (driver-friendly values)
max_scale=3.0

# Input size window where RTX VSR is reliable (pixels)
min_width=480
min_height=360
max_width=2560
max_height=1440

# Don't touch HDR (PQ/HLG) videos
skip_hdr=yes

# Show a message when toggling with alt+v
osd_messages=yes
