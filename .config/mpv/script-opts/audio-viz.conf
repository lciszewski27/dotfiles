# Cute audio visualizer (used by scripts/audio-viz.lua).
# Everything here is in English by design (mpv.conf uses slang/alang=en).

# Show the visualizer whenever music is playing (audio files with or without
# cover art). Real videos are never replaced.
# Toggle in-session:       v  = on/off
# Switch style in-session: V  = Cute -> Aurora -> Bars
enabled=yes

# Built-in style: cute, aurora, bars
#   cute   - soft blush/lavender CQT bars + scrolling sonogram (default)
#   aurora - dreamy nebula waterfall / spectrogram
#   bars   - pink, full-height frequency bars
style=cute

# Optional full custom lavfi-complex graph. Leave empty to use the built-in
# styles above. When set, this overrides `style`.
# The graph must consume [aid1] and provide audio [ao] + video [vo], e.g.:
#   filter=[aid1]asplit[ao][viz];[viz]showcqt=s=1920x1080:fps=60:bar_h=680:axis_h=40:sono_h=360:count=6:tc=0.17:text=0[vo]
filter=

# ---------------------------------------------------------------------------
# Notes for tweaking the built-in "cute" style (scripts/audio-viz.lua):
#
# Layout must add up to the frame height (1920x1080):
#   bar_h=500 (bars) + axis_h=40 (piano axis) + sono_h=540 (sonogram) = 1080
# Even numbers only, otherwise the top can be clipped.
#
# Color scheme = quiet RGB | loud RGB:
#   blush (default)  1|0.35|0.65|0.95|0.15|0.45
#   lavender         0.45|0.25|0.85|0.9|0.55|1
#   peach            1|0.55|0.35|1|0.3|0.65
#   mint             0.2|0.75|0.6|0.55|1|0.8
#
# Cute full-height bars (no sonogram):
#   bar_h=1080:axis_h=0:sono_h=0
# ---------------------------------------------------------------------------
