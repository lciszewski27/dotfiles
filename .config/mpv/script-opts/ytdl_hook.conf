# yt-dlp integration (mpv built-in ytdl_hook script).
# All messages and comments are in English (mpv.conf uses slang/alang=en).

# Format selection is controlled by `ytdl-format` in mpv.conf
# (this script reads options/ytdl-format automatically).
# There is no `ytdl_format` key here - keep format settings in mpv.conf.

# Path to yt-dlp (empty = auto-find yt-dlp / youtube-dl on PATH).
ytdl_path=

# Do not fetch all formats (faster startup, less bandwidth).
all_formats=no

# Use DASH manifests when available (better quality switching).
use_manifests=no

# Try loading cookies for age-restricted videos:
# copy browser cookies once with:
#   yt-dlp --cookies-from-browser firefox --cookies ~/.config/mpv/cookies.txt
# then uncomment the next line:
#cookies-file=~~/cookies.txt

# External downloader (aria2c) for faster HLS/DASH - uncomment if installed:
#external_downloader=aria2c
#external_downloader_args=--min-split-size=1M;--max-connection-per-server=16;--max-concurrent-downloads=16;--split=16
