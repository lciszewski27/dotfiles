# =============================================================================
#  mpv input bindings (all labels and messages are in English)
#  Lines ending with the bang marker become items of the right-click /
#  MENU-key context menu (uosc). mpv's built-in bindings (f, q, j,
#  9/0, arrows-left/right...)
#  keep working unless overridden below. Overridden on purpose:
#  v = visualizer on/off, V = visualizer style, s = screenshot, i = stats,
#  ` = console.
# =============================================================================

# --------------------------------- uosc UI -----------------------------------
MENU        script-binding uosc/menu-blurred
MBTN_RIGHT  script-binding uosc/menu-blurred
MBTN_LEFT   cycle pause                                  #! Click video = pause
TAB         script-binding uosc/items                    #! Playlist / open file
o           script-binding uosc/open-file                #! Open file
ctrl+v      script-binding uosc/paste                   #! Open > Paste URL / path
c           script-binding uosc/chapters                 #! Chapters
#  (alternative: bind script-binding uosc/audio-device to any key)
alt+s       script-binding uosc/subtitles                #! Subtitles
alt+a       script-binding uosc/audio                    #! Audio track
alt+d       script-binding uosc/video                    #! Video track
alt+q       script-binding uosc/stream-quality           #! Stream quality
alt+i       script-binding uosc/keybinds                 #! Utils > Key bindings
O           script-binding uosc/show-in-directory        #! Utils > Show in directory

# ------------------------------ Seeking / volume -----------------------------
space       cycle pause ; script-binding uosc/flash-pause-indicator
right       seek 5
left        seek -5
shift+right seek 30 ; script-binding uosc/flash-timeline
shift+left  seek -30 ; script-binding uosc/flash-timeline
WHEEL_UP    no-osd add volume 5 ; script-binding uosc/flash-volume
WHEEL_DOWN  no-osd add volume -5 ; script-binding uosc/flash-volume
shift+WHEEL_UP   seek 5 ; script-binding uosc/flash-timeline
shift+WHEEL_DOWN seek -5 ; script-binding uosc/flash-timeline
m           no-osd cycle mute ; script-binding uosc/flash-volume
up          no-osd add volume 5 ; script-binding uosc/flash-volume
down        no-osd add volume -5 ; script-binding uosc/flash-volume
[           no-osd add speed -0.1 ; script-binding uosc/flash-speed
]           no-osd add speed 0.1 ; script-binding uosc/flash-speed
BS          no-osd set speed 1 ; script-binding uosc/flash-speed

# ------------------------------- Playlist ------------------------------------
>           script-binding uosc/next ; script-message-to uosc flash-elements top_bar,timeline   #! Navigation > Next
<           script-binding uosc/prev ; script-message-to uosc flash-elements top_bar,timeline   #! Navigation > Prev
alt+>       script-binding uosc/delete-file-next          #! Navigation > Delete file & next
alt+<       script-binding uosc/delete-file-prev          #! Navigation > Delete file & prev
alt+esc     script-binding uosc/delete-file-quit          #! Navigation > Delete file & quit

# ----------------------------- Shaders (GPU look) ----------------------------
# alt+1 = quality CNN set for live action (default), alt+2 = Anime4K for anime,
# alt+3 = no user shaders (plain scalers + RTX VSR only)
alt+1 change-list glsl-shaders clr "" ; change-list glsl-shaders append "~~/shaders/FSRCNNX_x2_16-0-4-1.glsl" ; change-list glsl-shaders append "~~/shaders/SSimSuperRes.glsl" ; change-list glsl-shaders append "~~/shaders/KrigBilateral.glsl" ; change-list glsl-shaders append "~~/shaders/SSimDownscaler.glsl" ; change-list glsl-shaders append "~~/shaders/adaptive-sharpen.glsl" ; show-text "Shaders: QUALITY - FSRCNNX + Krig + SSim + sharpen" 2500  #! Shaders > Quality (live action)
alt+2 change-list glsl-shaders clr "" ; change-list glsl-shaders append "~~/shaders/Anime4K_v4.0/Anime4K_Clamp_Highlights.glsl" ; change-list glsl-shaders append "~~/shaders/Anime4K_v4.0/Anime4K_Restore_CNN_M.glsl" ; change-list glsl-shaders append "~~/shaders/Anime4K_v4.0/Anime4K_Upscale_CNN_x2_M.glsl" ; change-list glsl-shaders append "~~/shaders/Anime4K_v4.0/Anime4K_AutoDownscalePre_x2.glsl" ; change-list glsl-shaders append "~~/shaders/Anime4K_v4.0/Anime4K_AutoDownscalePre_x4.glsl" ; show-text "Shaders: ANIME - Anime4K v4.0 (Mode A)" 2500  #! Shaders > Anime (Anime4K v4)
alt+3 change-list glsl-shaders clr "" ; show-text "Shaders: OFF - scalers + RTX VSR only" 2500  #! Shaders > Off
#  change-list glsl-shaders append "~~/shaders/AMD_CAS.glsl"
#  change-list glsl-shaders append "~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"

# ---------------------------- RTX / video extras -----------------------------
alt+v       script-binding rtx_vsr/toggle                #! Video > RTX VSR (AI upscaling) on/off
alt+t       cycle-values interpolation "yes" "no" ; show-text "Interpolation: ${interpolation}" 1500  #! Video > Motion interpolation on/off
T           cycle ontop ; show-text "Stay on top: ${ontop}" 1500  #! View > Stay on top on/off
L           cycle-values loop-file "inf" "no" ; show-text "Loop file: ${loop-file}" 1500  #! Playback > Loop file on/off
v           script-binding audio_viz/toggle             #! View > Visualizer on/off
V           script-binding audio_viz/cycle-style        #! View > Visualizer style
i           script-binding stats/display-stats-toggle   #! View > Statistics on/off
`           script-binding console/enable               #! Utils > Console
s           screenshot                                  #! Utils > Screenshot
alt+u       script-binding uosc/audio-device            #! Utils > Audio device
alt+o       script-binding uosc/open-config-directory   #! Utils > Open config directory
