# =============================================================================
#  mpv - modern all-round setup (Linux Wayland + Windows / NVIDIA RTX)
#  ---------------------------------------------------------------------------
#  UI .............. uosc + thumbfast (cute pastel theme, rounded corners,
#                    hover thumbnails on the timeline, English menus)
#  Renderer ........ vo=gpu-next (auto GPU context: Wayland on Linux, D3D11 on
#                    Windows - required for RTX Video Super Resolution)
#  RTX ............. VSR auto-upscaling on Windows only
#                    (scripts/rtx-vsr.lua, toggle: alt+v)
#                    On Linux the script stays idle and the CNN shaders below
#                    handle upscaling instead.
#  Shaders ......... alt+1 FSRCNNX + Krig + SSim + sharpen (default)
#                    alt+2 Anime4K v4.0   |   alt+3 off
#  Extras .......... history, playlist manager, autoload, clip maker (W),
#                    screenshots, stats (i), console (`), audio visualizer
#                    (v = on/off, V = switch cute/aurora/bars style),
#                    watch-later/resume, network buffering, streaming (yt-dlp)
#
#  Language ...... English everywhere (slang/alang=en, uosc languages=en)
#  Keys: input.conf   |   Full guide: GUIDE.md
# =============================================================================

# ------------------------------- Video output --------------------------------
vo=gpu-next
# NOTE: gpu-api / gpu-context are left on auto on purpose.
# Forcing d3d11 here breaks Linux (Wayland). mpv auto-selects D3D11 on
# Windows (needed for RTX VSR) and Wayland/X11 on Linux.
hwdec=auto-safe             # NVIDIA NVDEC on Linux, D3D11VA on Windows
hwdec-codecs=h264,vc1,hevc,vp8,vp9,av1
vd-lavc-dr=yes              # direct rendering without extra frame copies
deinterlace=auto            # deinterlace only interlaced sources
input-media-keys=yes        # desktop media keys (play/pause/next/prev)
drag-and-drop=auto          # drag files onto the window to load them
taskbar-progress=yes
clipboard-backends=wayland,x11,vo

# ---------------------- Quality: scaling / debanding -------------------------
scale=ewa_lanczos4sharpest  # sharpest general-purpose upscaler (RTX 3070 has headroom)
dscale=mitchell             # mild downscaling (SSimDownscaler refines it)
cscale=ewa_lanczos           # chroma fallback (KrigBilateral handles 4:2:0 sources)
correct-downscaling=yes
tscale=oversample           # used when motion interpolation is on
video-sync=display-resample
interpolation=no            # smooth motion toggle - alt+t
deband=yes                  # remove color banding
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=24
dither-depth=auto

# ---------------------------------- HDR --------------------------------------
# On Windows HDR metadata is passed through (HDR display).
# On SDR screens mpv tone-maps HDR to SDR automatically.
target-colorspace-hint=auto
tone-mapping=auto
target-peak=auto
hdr-compute-peak=auto
inverse-tone-mapping=no

# ------------------------- Shaders: default quality set ----------------------
# FSRCNNX x2 (super-resolution CNN) + SSim scaling + KrigBilateral (chroma)
# + adaptive-sharpen. Shaders only kick in when they are actually useful.
# Switch sets with alt+1 / alt+2 / alt+3 - see input.conf.
glsl-shaders-append="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"
glsl-shaders-append="~~/shaders/KrigBilateral.glsl"
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"
glsl-shaders-append="~~/shaders/adaptive-sharpen.glsl"

# ---------------------- NVIDIA RTX Video Super Resolution --------------------
# Windows-only driver AI upscaling for videos smaller than the screen.
# scripts/rtx-vsr.lua activates it automatically and computes the exact scale
# factor from your display size. It is skipped on Linux (no D3D11 backend),
# and for HDR videos, big videos and cases where the GPU can't help.
# Toggle manually with alt+v.
#
# Notes:
#  * VSR requires "gpu-context=d3d11" + hardware decoding (set in [windows]).
#  * G-Sync is paused while VSR is upscaling (driver limitation).
#  * Optional RTX HDR (SDR -> HDR, needs an HDR display, driver 550+):
#      vf-append=d3d11vpp=nvidia-true-hdr

# ------------------------------- Subtitles -----------------------------------
sub-auto=fuzzy              # auto-load matching subtitle files
audio-file-auto=fuzzy       # auto-load matching audio tracks
sub-file-paths=subs;sub;subtitles
slang=en,eng               # subtitle language preference (English first)
alang=en,eng               # audio language preference (English first)
sub-fix-timing=yes
sub-ass-override=scale
blend-subtitles=video       # blend subs into video (looks better on HDR)
sub-pos=100
sub-scale-with-window=yes
secondary-sid=no

# ------------------------------ Audio ----------------------------------------
volume-max=200
gapless-audio=yes
audio-pitch-correction=yes
audio-display=embedded-first  # show embedded cover art if present
cover-art-auto=exact
audio-file-auto=fuzzy
audio-stream-silence=yes

# ------------------------------ OSD / UI -------------------------------------
# Title is drawn by the uosc top bar (keeps video OSD uncluttered).
osd-playing-msg=
osd-duration=3000
osd-font="Quicksand"
osd-font-size=32
osd-color="#FFF0F7"          # soft blush text
osd-outline-color="#2A1832"  # plum outline
osd-outline-size=1.8
osd-shadow-offset=0
osd-align-x=center
osd-align-y=top
osc=no                      # uosc replaces the built-in OSC
osd-bar=no                  # uosc draws its own seek bar
cursor-autohide=2500        # keep the cute UI around a little longer

# --------------------------- Window / playback -------------------------------
idle=yes                    # stay open when nothing is playing (uosc idle screen)
force-window=yes
keep-open=yes               # don't close after the video ends
autofit-larger=95%x95%
autofit-smaller=40%x40%
geometry=80%x80%+50%+50%
wayland-app-id=mpv
title="${media-title} - mpv"
save-position-on-quit=yes   # resume position next time
resume-playback=yes
write-filename-in-watch-later-config=yes
prefetch-playlist=yes

# -------------------------------- Streaming ----------------------------------
# yt-dlp integration (mpv 0.41): format selection + extras in
# script-opts/ytdl_hook.conf. AV1 is deprioritized because RTX 30-series
# cannot hardware-decode it (VP9/AVC decode on the GPU instead).
ytdl=yes
ytdl-format=bv*[vcodec!~='av01']+ba/b
hls-bitrate=max
network-timeout=60
user-agent="Mozilla/5.0"
cookies=no

# DVD / Blu-ray / CD (physical discs - insert and play e.g. dvd:// / bd://)
dvd-device=/dev/sr0
bluray-device=/dev/sr0
cdda-device=/dev/sr0

# -------------------------------- Screenshots --------------------------------
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory="~~/screenshots"
screenshot-template="%F - %04n"

# =============================================================================
#  Profiles
# =============================================================================

# Windows notes (this config auto-selects the right backend, so no
# OS-specific options are forced here):
# - On Windows vo=gpu-next automatically uses the D3D11 context, which is
#   what RTX VSR needs. If mpv ever picks a different context, set
#   gpu-context=d3d11 + hwdec=d3d11va in a local mpv-windows.conf.
# - Linux (this machine, Wayland + NVIDIA): NVDEC decoding is selected
#   below in the [linux] profile.

# Linux: Wayland + NVIDIA NVDEC decoding. RTX VSR script stays idle here.
[linux]
profile-desc=Linux (Wayland + NVIDIA NVDEC)
profile-cond=p.platform == 'linux'
hwdec=nvdec

# Applied automatically for network streams (http/https/rtmp/...)
[network]
profile-desc=Network stream (buffering + reconnect)
profile-cond=p.path and p.path:match("^%a[%w+.-]*://") ~= nil
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB
demuxer-readahead-secs=30
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5

# Manual low-latency profile for live content / sports:
#   mpv --profile=live <URL>
[live]
profile-desc=Live / low latency
cache=yes
demuxer-max-bytes=64MiB
demuxer-max-back-bytes=16MiB
demuxer-readahead-secs=1
video-sync=audio
interpolation=no
framedrop=vo

# HDR tone-mapping target for SDR screens (auto-applied when needed).
[hdr]
profile-desc=HDR to SDR tone mapping
profile-cond=p.video_params and p.video_params.gamma == 'pq'
hdr-compute-peak=auto
tone-mapping=auto

# Audio visualizer (pastel spectrum for music files): scripts/audio-viz.lua.
# All settings (enable, style, custom filter) live in
# script-opts/audio-viz.conf. In-session: v = on/off, V = Cute/Aurora/Bars.
