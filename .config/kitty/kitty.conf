# --- Czcionka i ligatury ---
font_family      Maple Mono NF SemiBold
disable_ligatures always

# --- Motyw (Matugen / Catppuccin) ---
# include ~/.config/kitty/themes/catppuccin-mocha.conf
include ~/.config/kitty/colors.conf
background_opacity 0.85

# --- Okno i marginesy ---
window_padding_width 15
confirm_os_window_close 0
remember_window_size no

# --- Skróty klawiszowe ---
map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+backspace send_text all \x1b\x7f

# --- Płynny kursor (efekt smugi) ---
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
