# ---------------------------------------------------------------
# Guard against the hyprlock 0.9.x crash on NVIDIA (hyprwm/hyprlock#991):
# when the monitor goes through DPMS off -> on while the screen is locked,
# hyprlock calls abort() and Hyprland drops into the "oopsie daisy" crash
# screen - keybinds stop working and only a hard reset is left.
#
# The look of this file is intentionally unchanged (wallpaper, blur, clock,
# song). The protection lives in the process instead: the SUPER+L bind starts
# ~/.local/bin/hyprlock-safe, which keeps the monitor awake while locked
# (no DPMS cycle = no crash), logs crashes and unlocks the session if
# hyprlock dies anyway.
# ---------------------------------------------------------------

# SOURCE COLORS (Ensure the path matches your matugen output)
source = ~/.config/hypr/matugen-hyprlock.conf

# BACKGROUND
background {
    monitor =
    path = $image  # Uses the wallpaper path from matugen
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 5
    disable_loading_bar = false
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 120
    font_family = Quicksand
    position = 0, -140
    halign = center
    valign = top
}

# DAY-DATE-MONTH
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date '+%A, %d %B')</span>"
    color = $on_surface
    font_size = 30
    font_family = Quicksand
    position = 0, 200
    halign = center
    valign = center
}

# LOGO
label {
    monitor =
    text =  
    color = $primary
    font_size = 120
    position = 0, 60
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hello, $USER ✨
    color = $on_surface
    font_size = 25
    font_family = Quicksand
    position = 0, -70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 290, 45
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $primary
    inner_color = $surface_container_low
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fail_text = <i>Wrong password</i>
    fail_timeout = 2000
    fade_on_empty = false
    font_family = Quicksand
    placeholder_text = <i><span>Password</span></i>
    hide_input = false
    position = 0, -140
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/scripts/songdetail.sh)"
    color = $secondary
    font_size = 16
    font_family = Quicksand
    position = 0, 80
    halign = center
    valign = bottom
}
