#  ┃┃┃┣┫ ┃ ┃┃┃┓┣ ┃┃━━┣┫┗┫┃┃┣┫┃ ┃┃┃ ┃┫ 
#  ┛ ┗┛┗ ┻ ┗┛┗┛┗┛┛┗  ┛┗┗┛┣┛┛┗┗┛┗┛┗┛┛┗┛
#                                     




# Image Path
$image = {{image}}

# An alpha background
$surface_alpha = rgba({{colors.surface.default.hex_stripped}}4d)

# All Colors
<* for name, value in colors *>
${{name}} = rgba({{value.default.hex_stripped}}ff)
<* endfor *>

-- ── Cozy layer: lifted surface ramp ───────────────────────────────────
-- Same one-tone lift as the compositor theme (design.md 3.2). Later
-- definitions override earlier ones, so these win over the loop above.
-- rgba() needs bare hex digits, so the "#" is stripped.
$background                = rgba({{colors.background.default.hex | lighten:4 | replace: "#", ""}}ff)
$surface                   = rgba({{colors.surface.default.hex | lighten:4 | replace: "#", ""}}ff)
$surface_dim               = rgba({{colors.surface_dim.default.hex | lighten:4 | replace: "#", ""}}ff)
$surface_bright            = rgba({{colors.surface_bright.default.hex | lighten:4 | replace: "#", ""}}ff)
$surface_container_lowest  = rgba({{colors.surface_container_lowest.default.hex | lighten:4 | replace: "#", ""}}ff)
$surface_container_low     = rgba({{colors.surface_container_low.default.hex | lighten:4 | replace: "#", ""}}ff)
$surface_container         = rgba({{colors.surface_container.default.hex | lighten:4 | replace: "#", ""}}ff)
$surface_container_high    = rgba({{colors.surface_container_high.default.hex | lighten:4 | replace: "#", ""}}ff)
$surface_container_highest = rgba({{colors.surface_container_highest.default.hex | lighten:4 | replace: "#", ""}}ff)
