-- Generated by Matugen
local theme = {
    image = "{{image}}",
    colors = {
<* for name, value in colors *>
        ["{{name}}"] = "#{{value.default.hex_stripped}}",
<* endfor *>

        -- ── Cozy layer: lifted surface ramp ─────────────────────────────
        -- Material 3's dark ramp bottoms out near-black, which makes
        -- elevation invisible and reads as a void. Raising the surface
        -- family one tone lets panels, notifications and windows separate
        -- by tone alone.
        --
        -- The duplicate keys are deliberate: in a Lua table constructor the
        -- last assignment wins, so these override the loop above.
        ["background"]                = "{{colors.background.default.hex | lighten:4}}",
        ["surface"]                   = "{{colors.surface.default.hex | lighten:4}}",
        ["surface_dim"]               = "{{colors.surface_dim.default.hex | lighten:4}}",
        ["surface_bright"]            = "{{colors.surface_bright.default.hex | lighten:4}}",
        ["surface_container_lowest"]  = "{{colors.surface_container_lowest.default.hex | lighten:4}}",
        ["surface_container_low"]     = "{{colors.surface_container_low.default.hex | lighten:4}}",
        ["surface_container"]         = "{{colors.surface_container.default.hex | lighten:4}}",
        ["surface_container_high"]    = "{{colors.surface_container_high.default.hex | lighten:4}}",
        ["surface_container_highest"] = "{{colors.surface_container_highest.default.hex | lighten:4}}",
    }
}

return theme
